name: NSE Signal Provider CI Engineering Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  software_tests:
    name: 1. Software Tests & pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Pytest Test Suite
        run: python -m pytest -q

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-test-results
          path: reports/

  compilation:
    name: 2. Source Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Source Compilation Check
        run: python -m compileall src server scripts

  security_invariants:
    name: 3. Security & Signal-Only Invariant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Verify Signal-Only Invariant (REAL_TRADING=FALSE)
        run: python -m pytest tests/test_core.py tests/test_trading_safety_invariant.py tests/test_api_publication_safety.py

      - name: Upload Security Evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-invariant-evidence
          path: reports/final_completion/trading_safety.json

  PIT_contracts:
    name: 4. PIT Contracts & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Schema, Identity, Temporal, and Row Accounting Validation
        run: |
          python scripts/build_final_pit_temporal_validation.py
          python scripts/build_final_row_accounting.py
          python -m pytest tests/test_historical_identity.py tests/test_historical_universe.py tests/test_pit_v13.py tests/test_row_accounting.py

      - name: Upload PIT Evidence
        uses: actions/upload-artifact@v4
        with:
          name: pit-contract-evidence
          path: |
            data/processed/final_pit_temporal_validation.json
            data/processed/final_row_accounting.json
            data/reference/identity_validation.json

  historical_data_validation:
    name: 5. Historical Data Coverage Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Historical Coverage & Raw Integrity Validation
        run: |
          python scripts/build_final_historical_coverage.py
          python scripts/build_final_raw_integrity.py

      - name: Upload Historical Coverage Evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-coverage-evidence
          path: |
            data/processed/final_historical_coverage.json
            data/processed/final_raw_integrity.json

  model_validation:
    name: 6. Model Validation, Calibration & Conformal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn numpy pandas joblib

      - name: Run Walk-Forward, Calibration & Conformal Validation
        run: |
          python scripts/run_real_walk_forward.py
          python scripts/build_calibration_conformal.py
          python scripts/build_historical_drift.py
          python scripts/build_economic_validation.py

      - name: Upload Model Validation Evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-evidence
          path: data/processed/model_validation/

  android_build:
    name: 7. Android Unit & Build (Test / Debug / Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Gradle Test & Assemble (Debug & Release)
        working-directory: ./android
        run: |
          ./gradlew test
          ./gradlew assembleDebug
          ./gradlew assembleRelease

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

  production_gate:
    name: 8. Production Gate Evaluation (CI_SOFTWARE_GREEN / PRODUCTION_DATA_GATE_BLOCKED)
    needs: [software_tests, compilation, security_invariants, PIT_contracts, historical_data_validation, model_validation, android_build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r server/requirements.txt

      - name: Evaluate Production Gate
        run: python scripts/run_production_gate.py

      - name: Upload Production Gate Evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-evidence
          path: |
            FINAL_PRODUCTION_GATE.json
            data/reference/production_gate_evidence_manifest.json
            docs/PRODUCTION_GATE_EVIDENCE_MATRIX.md
